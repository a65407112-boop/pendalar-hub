name: Build Classic Us Official Roles Backport

on:
  push:
    branches:
      - classicus-official-roles-backport
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: classicus-official-roles-backport

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Build patched ManuAPI for Classic Us 2026.9.20
        run: |
          git clone https://github.com/TechDevOfficial/ClassicUs.ManuAPI.git vendor/ClassicUs.ManuAPI
          git -C vendor/ClassicUs.ManuAPI checkout a633653f6eff00cba73eafb2da8dad14eb060b53
          python3 - <<'PY'
          from pathlib import Path
          p = Path("vendor/ClassicUs.ManuAPI/ManuAPI/Core/ManuAPIPlugin.cs")
          s = p.read_text(encoding="utf-8")
          if "using System;" not in s:
              s = "using System;\n" + s
          import re
          pattern = r"(?ms)^(?P<i>\s*)var harmony = new Harmony\(Guid\);\s*^\s*harmony\.PatchAll\(\);\s*^\s*Il2CppInteropCompat\.Apply\(harmony\);"
          replacement = """            var harmony = new Harmony(Guid);
            foreach (var type in typeof(ManuAPIPlugin).Assembly.GetTypes())
            {
                if (type.GetCustomAttributes(typeof(HarmonyPatch), true).Length == 0) continue;
                try
                {
                    harmony.CreateClassProcessor(type).Patch();
                }
                catch (Exception e)
                {
                    Log.LogWarning("Skipping incompatible ManuAPI patch " + type.FullName + ": " + e.Message);
                }
            }
            Il2CppInteropCompat.Apply(harmony);"""
          s2, count = re.subn(pattern, replacement, s, count=1)
          if count != 1:
              print(s)
              raise SystemExit("Could not locate ManuAPI Harmony startup block")
          p.write_text(s2, encoding="utf-8")

          rp = Path("vendor/ClassicUs.ManuAPI/ManuAPI/Roles/RoleRegistry.cs")
          rs = rp.read_text(encoding="utf-8")
          rs = rs.replace("if (!ManactorAPI.IsFromHost(senderId))", "if (!IsFromHostCompat(senderId))")
          marker = "        private static PlayerControl FindPlayer(byte playerId)"
          helper = ("        private static bool IsFromHostCompat(byte senderId)\n"
                    "        {\n"
                    "            var client = AmongUsClient.Instance;\n"
                    "            if (client == null) return false;\n"
                    "            foreach (var p in PlayerControl.AllPlayerControls)\n"
                    "            {\n"
                    "                if (p == null || p.Data == null || p.Data.PlayerId != senderId) continue;\n"
                    "                return p.OwnerId == client.HostId;\n"
                    "            }\n"
                    "            return false;\n"
                    "        }\n\n")
          if marker not in rs:
              raise SystemExit("Could not locate RoleRegistry FindPlayer marker")
          rs = rs.replace(marker, helper + marker, 1)
          rp.write_text(rs, encoding="utf-8")
          PY
          dotnet restore vendor/ClassicUs.ManuAPI/ManuAPI/ManuAPI.csproj
          dotnet build vendor/ClassicUs.ManuAPI/ManuAPI/ManuAPI.csproj -c Release --no-restore

      - name: Restore and build role backport
        run: |
          dotnet restore ClassicusRoleBackport/ClassicUs.OfficialRolesBackport.csproj
          dotnet build ClassicusRoleBackport/ClassicUs.OfficialRolesBackport.csproj -c Release --no-restore

      - name: Assemble install folder
        run: |
          mkdir -p dist/BepInEx/plugins/OfficialRolesBackport
          cp ClassicusRoleBackport/bin/Release/ClassicUs.OfficialRolesBackport.dll dist/BepInEx/plugins/OfficialRolesBackport/
          curl -L --fail -o dist/BepInEx/plugins/OfficialRolesBackport/ClassicUs.Manactor.dll https://github.com/TechDevOfficial/ClassicUs.Manactor/releases/download/v1.2.0/ClassicUs.Manactor.dll
          cp vendor/ClassicUs.ManuAPI/ManuAPI/bin/Release/ClassicUs.ManuAPI.dll dist/BepInEx/plugins/OfficialRolesBackport/
          cp ClassicusRoleBackport/Extract-OfficialAssets.ps1 dist/BepInEx/plugins/OfficialRolesBackport/
          cp ClassicusRoleBackport/Extract-OfficialAssets.cmd dist/BepInEx/plugins/OfficialRolesBackport/
          cp ClassicusRoleBackport/README.md dist/

      - name: Upload mod package
        uses: actions/upload-artifact@v4
        with:
          name: ClassicUs-OfficialRolesBackport
          path: dist/
          if-no-files-found: error
